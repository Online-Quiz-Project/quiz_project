# Production never changes table structure automatically. Apply database_schema.sql
# or a reviewed migration before starting a new production version.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jackson.serialization.indent_output=false

app.bootstrap-admin.enabled=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Do not include stack traces or internal exception details in HTTP responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Production frontend origins are supplied as a comma-separated environment value.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.application.name=quiz_backend
spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Preserve instructor-created quizzes and student attempts during normal
# development. Use the reset profile only when a fresh sample database is wanted.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.sql.init.data-locations=file:./sample.sql
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jackson.serialization.indent_output=false
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
logging.service.url=${LOGGING_SERVICE_URL:http://localhost:5050}
app.jwt.secret=${JWT_SECRET:quizly-local-development-secret-change-before-production}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Swagger UI is available at /swagger-ui.html and reads this generated API description.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Local development origins. application-prod.properties replaces this value.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
